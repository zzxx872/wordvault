name: Generate iOS Word Lists

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate cities plist
        run: |
          python3 << 'EOF'
import json
import os

# Read cities from JSON file
with open('WordVault/cities.json', 'r', encoding='utf-8') as f:
    cities = json.load(f)

# Generate plist
plist = '''<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<array>
'''

for city in cities:
    # Escape XML special characters
    city_esc = city.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;').replace("'", '&apos;')
    plist += f'''    <dict>
        <key>phrase</key>
        <string>{city_esc}</string>
        <key>shortcut</key>
        <string></string>
    </dict>
'''

plist += '''</array>
</plist>
'''

# Write file
with open('cities.plist', 'w', encoding='utf-8') as f:
    f.write(plist)

print(f"Generated cities.plist with {len(cities)} cities")
EOF

      - name: Verify output
        run: |
          echo "Generated files:"
          ls -lh cities.plist
          echo ""
          echo "First 30 lines:"
          head -30 cities.plist
          echo ""
          echo "Last 10 lines:"
          tail -10 cities.plist

      - name: Upload plist file
        uses: actions/upload-artifact@v4
        with:
          name: cities-plist
          path: cities.plist
          retention-days: 30

      - name: Generate contacts sample plist
        run: |
          python3 << 'EOF'
contacts = ["张三", "李四", "王五", "赵六", "钱七", "孙八", "周九", "吴十"]

plist = '''<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<array>
'''

for name in contacts:
    plist += f'''    <dict>
        <key>phrase</key>
        <string>{name}</string>
        <key>shortcut</key>
        <string></string>
    </dict>
'''

plist += '''</array>
</plist>
'''

with open('contacts_sample.plist', 'w', encoding='utf-8') as f:
    f.write(plist)

print(f"Generated contacts_sample.plist with {len(contacts)} sample contacts")
EOF

      - name: Upload contacts plist
        uses: actions/upload-artifact@v4
        with:
          name: contacts-sample-plist
          path: contacts_sample.plist
          retention-days: 30

      - name: Summary
        run: |
          echo ""
          echo "=========================================="
          echo "   GENERATION COMPLETED!"
          echo "=========================================="
          echo ""
          echo "Download the plist files from Artifacts:"
          echo "  1. cities-plist - 585 Chinese cities"
          echo "  2. contacts-sample-plist - Sample contacts"
          echo ""
          echo "iPhone Import Steps:"
          echo "  1. Settings > General > Keyboard > Text Replacement"
          echo "  2. Tap + > Import Phrases..."
          echo "  3. Select the downloaded .plist file"
          echo ""
          ls -lh *.plist
