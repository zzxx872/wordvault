name: Generate iOS Word Lists

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate cities plist
        run: python3 scripts/generate_cities.py

      - name: Generate contacts plist
        run: python3 scripts/generate_contacts.py

      - name: Upload plist files
        uses: actions/upload-artifact@v4
        with:
          name: ios-wordlists
          path: |
            cities.plist
            contacts_sample.plist
          retention-days: 30

      - name: Summary
        run: |
          echo "=========================================="
          echo "   GENERATION COMPLETED!"
          echo "=========================================="
          echo ""
          echo "Download ios-wordlists from Artifacts"
          echo ""
          echo "iPhone Import Steps:"
          echo "  1. Settings > General > Keyboard > Text Replacement"
          echo "  2. Tap + > Import Phrases..."
          echo "  3. Select the downloaded .plist file"
          ls -lh *.plist
