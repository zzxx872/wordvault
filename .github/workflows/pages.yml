# Deploy the dictionary workbench in docs/ to GitHub Pages.
#
# THIS IS OPTIONAL. The repo's default setup is branch deployment, which needs no
# workflow at all:
#   Settings > Pages > Source = "Deploy from a branch"
#   Branch = main, folder = /docs
#
# Only use this workflow if you prefer an Actions-based deploy. In that case set
# Settings > Pages > Source = "GitHub Actions" FIRST, otherwise this job fails.
# It is deliberately workflow_dispatch-only so it never conflicts with the
# branch deployment above.

name: Deploy WordVault Web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
