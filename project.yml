name: WordVault
options:
  bundleIdPrefix: com.wordvault
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: WordVault/Info.plist
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  WordVault:
    type: application
    platform: iOS
    sources:
      - path: WordVault
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
          - "project.yml"
    resources:
      - path: WordVault/cities.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordvault.app
        INFOPLIST_FILE: WordVault/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
