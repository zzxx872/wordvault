name: Build iOS Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: List available simulators
        run: |
          echo "Available iOS simulators:"
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20

      - name: Build project
        id: build
        run: |
          echo "Building WordVault..."
          xcodebuild -project WordVault.xcodeproj \
            -scheme WordVault \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

          if grep -q "BUILD SUCCEEDED" build.log; then
            echo "BUILD_RESULT=success" >> $GITHUB_ENV
            echo "Build succeeded!"
          else
            echo "BUILD_RESULT=failed" >> $GITHUB_ENV
            tail -50 build.log
            exit 1
          fi

      - name: Generate cities plist
        if: env.BUILD_RESULT == 'success'
        run: |
          echo "Generating cities.plist..."
          python3 scripts/generate_plist.py

      - name: Upload plist files
        if: env.BUILD_RESULT == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-wordlists
          path: |
            cities.plist
          retention-days: 30

      - name: Success Summary
        if: env.BUILD_RESULT == 'success'
        run: |
          echo "========================================"
          echo "BUILD COMPLETED!"
          echo "========================================"
          echo "Download cities.plist from Artifacts"
          echo ""
          echo "iPhone Import Steps:"
          echo "1. Settings > General > Keyboard > Text Replacement"
          echo "2. Tap + > Import Phrases..."
          echo "3. Select cities.plist"
          ls -lh *.plist
